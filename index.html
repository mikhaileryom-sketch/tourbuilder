<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TourBuilder - Платформа</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F5F5F7;
            color: #1A1A1A;
            overflow: hidden;
            height: 100dvh;
            user-select: none;
            display: flex;
            flex-direction: column;
        }

        /* === НИЖНЯЯ НАВИГАЦИЯ (5 вкладок) === */
        .bottom-nav {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 10px 18px; border-radius: 40px; z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.05);
        }
        .nav-icon { font-size: 22px; color: #6E6E73; cursor: pointer; transition: color 0.3s, transform 0.2s; }
        .nav-icon.active { color: #EC4899; transform: translateY(-3px); }
        .nav-icon:hover { color: #EC4899; }

        /* === ЭКРАНЫ === */
        .screen { display: none; width: 100%; height: calc(100vh - 80px); position: absolute; top: 0; left: 0; overflow-y: auto; padding-bottom: 80px; box-sizing: border-box;}
        .screen.active { display: flex; justify-content: center; align-items: center; flex-direction: column; }

        /* === КНОПКИ === */
        button { background: #EC4899; color: white; border: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); transition: transform 0.2s;}
        button:active { transform: scale(0.95); }
        .btn-secondary { background: #FFFFFF; color: #EC4899; border: 2px solid #EC4899; box-shadow: none; }

        /* === ЭКРАН 1: ГЛАВНАЯ === */
        #screen-home .honeycomb-frame {
            position: relative; width: 96vw; height: 88dvh;
            clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0% 75%, 0% 25%);
            background: #FFFFFF; border: 2px solid rgba(236, 72, 153, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex; justify-content: center; align-items: center; z-index: 10;
        }
        #screen-home .center-id {
            width: 160px; height: 160px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: #F5F5F7; border: 3px solid #EC4899;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; font-weight: 800; font-size: 16px; color: #1A1A1A;
            z-index: 15; cursor: pointer; padding: 10px; box-sizing: border-box;
        }
        #screen-home .center-id span { font-size: 11px; font-weight: 400; color: #6E6E73; margin-top: 5px; }
        #screen-home .user-cell {
            position: absolute; width: 60px; height: 60px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background-size: cover; background-position: center;
            border: 2px solid #E5E5EA; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            cursor: pointer; transition: transform 0.2s, border-color 0.2s; z-index: 5;
        }
        #screen-home .user-cell:hover { transform: scale(1.3); border-color: #EC4899; z-index: 50; }

        /* === ЭКРАНЫ КАТАЛОГОВ (Артисты, Площадки) === */
        .catalog-screen { background: #F5F5F7; padding-top: 20px; }
        .catalog-screen h1 { font-size: 24px; margin-bottom: 20px; color: #1A1A1A; }
        .search-bar {
            width: 90%; max-width: 400px; padding: 15px;
            border: 2px solid #E5E5EA; border-radius: 30px; font-size: 16px;
            margin-bottom: 15px; background: #FFFFFF; outline: none;
            text-align: center; box-sizing: border-box; color: #1A1A1A;
        }
        .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;}
        .filter-btn { background: #FFFFFF; color: #6E6E73; border: 1px solid #E5E5EA; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .filter-btn.active { background: #EC4899; color: white; border: none; }
        .catalog-grid { display: grid; grid-template-columns: repeat(3, 100px); gap: 15px; justify-content: center; }
        .catalog-cell {
            width: 100px; height: 100px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background-size: cover; background-position: center;
            border: 2px solid #E5E5EA; background-color: #FFFFFF;
            cursor: pointer; transition: transform 0.2s;
            display: flex; align-items: flex-end; justify-content: center;
        }
        .catalog-cell span { background: rgba(26,26,26,0.7); color: #fff; font-size: 11px; width: 100%; text-align: center; padding: 2px 0; }
        .catalog-cell:hover { transform: scale(1.05); border-color: #EC4899; }

        /* === ДЕТАЛЬНЫЕ СТРАНИЦЫ === */
        .detail-screen { background: #F5F5F7; padding: 20px; justify-content: flex-start !important; }
        .detail-photo { width: 200px; height: 200px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background-size: cover; background-position: center; border: 4px solid #EC4899; margin-bottom: 20px; background-color: #FFFFFF; }
        .detail-name { font-size: 28px; font-weight: 800; color: #1A1A1A; text-align: center; }
        .detail-spec { font-size: 16px; color: #6E6E73; margin-bottom: 20px; text-align: center;}
        .mini-calendar { width: 100%; max-width: 400px; background: #FFFFFF; border-radius: 15px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .mini-calendar h3 { text-align: center; color: #1A1A1A; margin-bottom: 10px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day { height: 30px; display: flex; justify-content: center; align-items: center; font-size: 11px; }

        /* === СТАТУСЫ === */
        .status-free { background: #4CAF50; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 10px; }
        .status-busy { background: #F44336; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 10px; }
        .status-req { background: #FFEB3B; border-radius: 4px; display: flex; justify-content: center; align-items: center; color: black; font-weight: bold; font-size: 10px; }
        .status-active { background: #2196F3; clip-path: polygon(50% 0%, 100% 100%, 0% 100%); display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 10px; }
        .status-confirm { background: #9C27B0; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 10px; }

        /* === ЭКРАН ЦИФЕРБЛАТА === */
        #screen-calendar { background: #F5F5F7; padding: 20px; justify-content: flex-start !important; overflow-y: auto; }
        #screen-calendar h1 { color: #1A1A1A; margin-bottom: 10px; }
        #wheel-container { position: relative; width: 340px; height: 340px; margin: 20px auto; }
        .month-sector {
            position: absolute; top: 50%; left: 50%;
            width: 60px; height: 160px;
            margin-top: -160px; margin-left: -30px;
            transform-origin: 50% 100%;
            clip-path: polygon(20% 100%, 80% 100%, 100% 0, 0 0);
            background: #FFFFFF; border: 2px solid #E5E5EA;
            display: flex; flex-direction: column; align-items: center; justify-content: space-around;
            padding: 4px; cursor: pointer;
            transition: background 0.3s, transform 0.3s;
        }
        .month-sector:hover { background: rgba(236, 72, 153, 0.1); transform: scale(1.1); z-index: 10; }
        .month-title { font-size: 11px; font-weight: bold; color: #EC4899; }
        .inner-hexes { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
        .inner-hex { width: 11px; height: 11px; font-size: 7px; line-height: 11px; text-align: center; }

        /* === ЭКРАН ИИ-ПОДБОРА === */
        #screen-match { background: #F5F5F7; padding: 20px; justify-content: flex-start !important; overflow-y: auto; }
        #screen-match h1 { color: #1A1A1A; margin-bottom: 5px; font-size: 22px;}
        #screen-match .subtitle { color: #6E6E73; font-size: 13px; margin-bottom: 20px; text-align: center;}
        .form-group { width: 100%; max-width: 400px; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #6E6E73; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border: 1px solid #E5E5EA;
            border-radius: 12px; font-size: 15px; box-sizing: border-box;
            background: #FFFFFF; color: #1A1A1A; outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: #EC4899; }
        #match-results { width: 100%; max-width: 400px; margin-top: 25px; }
        .match-card {
            background: #FFFFFF; border-radius: 15px; padding: 12px;
            margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            display: flex; align-items: center; gap: 10px;
            border-left: 4px solid #EC4899;
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .match-card .avatar {
            width: 50px; height: 50px; flex-shrink: 0;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background-size: cover; background-position: center;
            border: 2px solid #EC4899; background-color: #F5F5F7;
        }
        .match-card .info { flex-grow: 1; text-align: left; min-width: 0;}
        .match-card .name { font-weight: 800; font-size: 15px; color: #1A1A1A; margin-bottom: 3px;}
        .match-card .spec { font-size: 11px; color: #6E6E73; margin-bottom: 3px;}
        .match-card .reason { font-size: 10px; color: #999; line-height: 1.3;}
        .match-card .right-block { display: flex; flex-direction: column; align-items: center; gap: 5px;}
        .match-card .score { font-weight: 900; font-size: 18px; color: #EC4899; text-align: center; min-width: 45px; }
        .match-card .score small { display: block; font-size: 8px; color: #999; font-weight: 400; }
        .match-card .add-btn {
            background: #EC4899; color: white; border: none;
            padding: 6px 10px; border-radius: 15px; font-size: 10px;
            cursor: pointer; font-weight: bold; white-space: nowrap;
        }
        .no-results { text-align: center; color: #6E6E73; padding: 30px 20px; font-size: 14px;}

        /* === УВЕДОМЛЕНИЕ TOAST === */
        .toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: #1A1A1A; color: #fff; padding: 12px 25px; border-radius: 30px;
            font-size: 14px; font-weight: 600; z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* === МОДАЛКА ДНЯ === */
        #day-details-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #FFFFFF; border: 1px solid #E5E5EA; border-radius: 15px; padding: 20px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 100; color: #1A1A1A; }
        #day-details-modal h3 { color: #EC4899; margin-bottom: 10px; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #FFFFFF; color: #1A1A1A; font-size: 24px; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 200; border: 1px solid #E5E5EA; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div id="screen-home" class="screen active">
        <div class="honeycomb-frame">
            <div class="center-id" id="user-id-block">KARL & BAND<span>ID: 001</span></div>
            <div id="users-container"></div>
        </div>
    </div>

    <!-- ЭКРАН 2: КАТАЛОГ АРТИСТОВ -->
    <div id="screen-catalog" class="screen catalog-screen">
        <button class="back-btn" onclick="navigateTo('screen-home')">←</button>
        <h1>Артисты</h1>
        <input type="text" class="search-bar" placeholder="Поиск по имени..." oninput="filterArtists(this.value)">
        <div class="filters">
            <button class="filter-btn active" onclick="setFilter(this, 'all')">Все</button>
            <button class="filter-btn" onclick="setFilter(this, 'dance')">Танцы</button>
            <button class="filter-btn" onclick="setFilter(this, 'music')">Музыка</button>
            <button class="filter-btn" onclick="setFilter(this, 'show')">Шоу</button>
        </div>
        <div class="catalog-grid" id="artists-grid"></div>
    </div>

    <!-- ЭКРАН 3: ДЕТАЛИ АРТИСТА -->
    <div id="screen-artist" class="screen detail-screen">
        <button class="back-btn" onclick="navigateTo('screen-catalog')">←</button>
        <div id="artist-detail-content"></div>
    </div>

    <!-- ЭКРАН 4: ЦИФЕРБЛАТ -->
    <div id="screen-calendar" class="screen">
        <button class="back-btn" onclick="navigateTo('screen-home')">←</button>
        <h1>Календарь</h1>
        <div class="nav-arrows" style="display:flex; gap:20px; margin-bottom:10px; align-items:center;">
            <button onclick="changeYear(-1)">←</button>
            <span id="year-display" style="font-size:24px; font-weight:bold;">2026</span>
            <button onclick="changeYear(1)">→</button>
        </div>
        <div id="wheel-container"></div>
    </div>

    <!-- ЭКРАН 5: ИИ-ПОДБОР -->
    <div id="screen-match" class="screen">
        <button class="back-btn" onclick="navigateTo('screen-home')">←</button>
        <h1>🔍 ИИ-Подбор</h1>
        <div class="subtitle">Заполните ТЗ — подберём лучших за 10 минут</div>

        <div class="form-group"><label>Дата / период</label><input type="date" id="match-date" value="2026-09-12"></div>
        <div class="form-group"><label>Жанр / тип</label>
            <select id="match-genre">
                <option value="any">Любой</option>
                <option value="dance">Танцы</option>
                <option value="music">Музыка</option>
                <option value="show">Шоу</option>
            </select>
        </div>
        <div class="form-group"><label>Бюджет, ₽</label><input type="text" id="match-budget" placeholder="например, 50000" value="50000"></div>
        <div class="form-group"><label>Город</label><input type="text" id="match-city" placeholder="например, Москва" value="Москва"></div>
        <div class="form-group"><label>Дополнительно (по желанию)</label><input type="text" id="match-extra" placeholder="Свет, звук, костюмы..."></div>

        <button onclick="runAIMatch()" style="margin-top:10px; width:100%; max-width:400px;">✨ Подобрать артистов</button>
        <div id="match-results"></div>
    </div>

    <!-- ЭКРАН 6: КАТАЛОГ ПЛОЩАДОК -->
    <div id="screen-venues" class="screen catalog-screen">
        <button class="back-btn" onclick="navigateTo('screen-home')">←</button>
        <h1>Площадки</h1>
        <input type="text" class="search-bar" placeholder="Поиск по названию..." oninput="filterVenues(this.value)">
        <div class="catalog-grid" id="venues-grid"></div>
    </div>

    <!-- ЭКРАН 7: ДЕТАЛИ ПЛОЩАДКИ -->
    <div id="screen-venue" class="screen detail-screen">
        <button class="back-btn" onclick="navigateTo('screen-venues')">←</button>
        <div id="venue-detail-content"></div>
    </div>

    <!-- МОДАЛКА ДНЯ -->
    <div id="day-details-modal">
        <h3 id="modal-date"></h3>
        <div id="modal-body"></div>
        <button style="margin-top:15px;" onclick="closeModal()">Закрыть</button>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ (5 вкладок) -->
    <div class="bottom-nav">
        <div class="nav-icon active" onclick="navigateTo('screen-home', this)" title="Главная">🏠</div>
        <div class="nav-icon" onclick="navigateTo('screen-catalog', this)" title="Артисты">👥</div>
        <div class="nav-icon" onclick="navigateTo('screen-venues', this)" title="Площадки">🏛️</div>
        <div class="nav-icon" onclick="navigateTo('screen-calendar', this)" title="Календарь">📅</div>
        <div class="nav-icon" onclick="navigateTo('screen-match', this)" title="ИИ-Подбор">🔍</div>
    </div>

    <script>
        // === TELEGRAM SDK ===
        let tgUser = null;
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#F5F5F7');
            tg.setBackgroundColor('#F5F5F7');
            tgUser = tg.initDataUnsafe?.user || null;
        }

        // === КОНФИГ API ===
        // ⚠️ Вставьте сюда вашу ссылку /exec из Google Apps Script
        const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbzC9pzxBXRfIvgyXb5J8AWmepaak7YJHNA46TbGTgfLJPYD_BJnX-YqLhRc0N0lPrXJ/exec';

        // === ГЛОБАЛЬНЫЕ ДАННЫЕ ===
        let artists = [];
        let venues = [];
        let events = []; // Мероприятия для календаря
        let userProject = JSON.parse(localStorage.getItem('userProject') || '[]');
        let state = { year: 2026, monthIndex: 8, day: 1 };

        // === FALLBACK (Mock) данные если API не доступен ===
        const MOCK_ARTISTS = [
            { id: 1, name: "Ivan", spec: "Танцор", genre: "dance", img: "https://i.pravatar.cc/150?img=11", price: 40000, city: "Москва", rating: 4.9, verified: true, freeDates: ["2026-09-12", "2026-09-15"] },
            { id: 2, name: "Mila", spec: "Вокалистка", genre: "music", img: "https://i.pravatar.cc/150?img=5", price: 60000, city: "Москва", rating: 5.0, verified: true, freeDates: ["2026-09-12", "2026-09-13"] },
            { id: 3, name: "DJ Oleg", spec: "Диджей", genre: "music", img: "https://i.pravatar.cc/150?img=12", price: 35000, city: "СПб", rating: 4.7, verified: false, freeDates: ["2026-09-12"] },
            { id: 4, name: "Anna", spec: "Ведущая", genre: "show", img: "https://i.pravatar.cc/150?img=9", price: 45000, city: "Москва", rating: 4.8, verified: true, freeDates: ["2026-09-12", "2026-09-14"] },
            { id: 5, name: "Max", spec: "Шоу-балет", genre: "dance", img: "https://i.pravatar.cc/150?img=13", price: 80000, city: "Москва", rating: 4.9, verified: true, freeDates: ["2026-09-10"] },
            { id: 6, name: "Lena", spec: "Музыкант", genre: "music", img: "https://i.pravatar.cc/150?img=16", price: 30000, city: "Казань", rating: 4.6, verified: false, freeDates: ["2026-09-12"] },
            { id: 7, name: "Rock Band", spec: "Группа", genre: "music", img: "https://i.pravatar.cc/150?img=60", price: 120000, city: "Москва", rating: 4.9, verified: true, freeDates: ["2026-09-12"] },
            { id: 8, name: "Solo", spec: "Фокусник", genre: "show", img: "https://i.pravatar.cc/150?img=15", price: 55000, city: "Москва", rating: 4.5, verified: false, freeDates: ["2026-09-12"] }
        ];

        const MOCK_VENUES = [
            { id: 1, name: "Клуб Москва", city: "Москва", type: "Клуб", capacity: 500, price: 80000, img: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300" },
            { id: 2, name: "Театр Сцена", city: "СПб", type: "Театр", capacity: 300, price: 60000, img: "https://images.unsplash.com/photo-1503095396549-807759245b35?w=300" },
            { id: 3, name: "Усадьба Архангельское", city: "Москва", type: "Усадьба", capacity: 200, price: 150000, img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=300" },
            { id: 4, name: "Отель Ритц", city: "Москва", type: "Отель", capacity: 150, price: 120000, img: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=300" },
            { id: 5, name: "ДК Ленсовета", city: "СПб", type: "ДК", capacity: 800, price: 90000, img: "https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?w=300" },
            { id: 6, name: "Лофт Красный", city: "Москва", type: "Лофт", capacity: 250, price: 70000, img: "https://images.unsplash.com/photo-1554189097-ffe88e998a2b?w=300" }
        ];

        // === ЗАГРУЗКА ДАННЫХ ===
        async function loadData() {
            try {
                // Пробуем загрузить реальные данные
                const [aRes, vRes, eRes] = await Promise.all([
                    fetch(SHEET_API_URL + '?action=artists').then(r => r.json()).catch(() => null),
                    fetch(SHEET_API_URL + '?action=venues').then(r => r.json()).catch(() => null),
                    fetch(SHEET_API_URL + '?action=events').then(r => r.json()).catch(() => null)
                ]);

                artists = aRes && aRes.length ? aRes : MOCK_ARTISTS;
                venues = vRes && vRes.length ? vRes : MOCK_VENUES;
                events = eRes && eRes.length ? eRes : [];
            } catch (err) {
                console.log('API недоступен, используем demo-данные:', err);
                artists = MOCK_ARTISTS;
                venues = MOCK_VENUES;
            }
            renderHome();
        }

        // === НАВИГАЦИЯ ===
        function navigateTo(screenId, navEl) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            document.querySelectorAll('.nav-icon').forEach(el => el.classList.remove('active'));
            if (navEl) navEl.classList.add('active');

            if (screenId === 'screen-home') renderHome();
            if (screenId === 'screen-catalog') renderCatalog();
            if (screenId === 'screen-venues') renderVenues();
            if (screenId === 'screen-calendar') renderWheel();
        }

        // === TOAST уведомление ===
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // === ГЛАВНАЯ ===
        function renderHome() {
            // Показываем имя пользователя из Telegram
            const userBlock = document.getElementById('user-id-block');
            if (tgUser && tgUser.first_name) {
                userBlock.innerHTML = `${tgUser.first_name}${tgUser.last_name ? ' ' + tgUser.last_name : ''}<span>ID: ${tgUser.id || 'guest'}</span>`;
            } else {
                userBlock.innerHTML = `KARL & BAND<span>ID: 001 (гость)</span>`;
            }

            const container = document.getElementById('users-container');
            container.innerHTML = '';
            const users = artists.slice(0, 6);
            const positions = [
                { x: "20%", y: "25%" }, { x: "75%", y: "20%" },
                { x: "15%", y: "70%" }, { x: "80%", y: "65%" },
                { x: "8%", y: "48%" },  { x: "87%", y: "45%" }
            ];
            users.forEach((user, i) => {
                let cell = document.createElement('div');
                cell.className = 'user-cell';
                cell.style.left = positions[i].x;
                cell.style.top = positions[i].y;
                cell.style.backgroundImage = `url('${user.img}')`;
                cell.onclick = () => openArtist(user.id);
                container.appendChild(cell);
            });
        }

        // === КАТАЛОГ АРТИСТОВ ===
        let currentFilter = 'all';
        function setFilter(btn, filter) {
            currentFilter = filter;
            document.querySelectorAll('#screen-catalog .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCatalog();
        }
        function filterArtists(query) { renderCatalog(query); }

        function renderCatalog(query = '') {
            const grid = document.getElementById('artists-grid');
            if (!grid) return;
            grid.innerHTML = '';
            let filtered = artists;
            if (currentFilter !== 'all') filtered = filtered.filter(a => a.genre === currentFilter);
            if (query) filtered = filtered.filter(a => a.name.toLowerCase().includes(query.toLowerCase()));

            filtered.forEach(artist => {
                let cell = document.createElement('div');
                cell.className = 'catalog-cell';
                cell.style.backgroundImage = `url('${artist.img}')`;
                cell.innerHTML = `<span>${artist.name}</span>`;
                cell.onclick = () => openArtist(artist.id);
                grid.appendChild(cell);
            });
            if (filtered.length === 0) grid.innerHTML = '<p style="color:#6E6E73; grid-column: 1/-1;">Никого не найдено</p>';
        }

        // === ДЕТАЛИ АРТИСТА ===
        function openArtist(id) {
            const artist = artists.find(a => a.id === id);
            if (!artist) return;
            const container = document.getElementById('artist-detail-content');
            
            // Мини-календарь со всеми днями месяца
            let daysHTML = '';
            const daysInMonth = new Date(state.year, state.monthIndex + 1, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${state.year}-${String(state.monthIndex + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const ev = events.find(e => e.date === dateStr && e.artistId === artist.id);
                let statusClass = 'status-free'; // По умолчанию свободен (зеленый шестиугольник)
                let letter = 'С';
                if (ev) {
                    if (ev.status === 'busy') { statusClass = 'status-busy'; letter = 'З'; }
                    else if (ev.status === 'req') { statusClass = 'status-req'; letter = '?'; }
                    else if (ev.status === 'active') { statusClass = 'status-active'; letter = 'А'; }
                    else if (ev.status === 'confirm') { statusClass = 'status-confirm'; letter = 'П'; }
                }
                daysHTML += `<div class="day ${statusClass}" title="${dateStr}">${letter}</div>`;
            }

            const isInProject = userProject.some(p => p.id === artist.id && p.type === 'artist');
            container.innerHTML = `
                <div class="detail-photo" style="background-image: url('${artist.img}')"></div>
                <div class="detail-name">${artist.name}</div>
                <div class="detail-spec">${artist.spec} · ${artist.city}</div>
                <div style="margin-bottom:20px; color:#6E6E73; text-align:center;">Рейтинг: ⭐ ${artist.rating} · Гонорар: от ${artist.price.toLocaleString()} ₽</div>
                
                <h3 style="color:#1A1A1A;">Занятость на месяц</h3>
                <div class="mini-calendar">
                    <h3>${['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'][state.monthIndex]} ${state.year}</h3>
                    <div class="days-grid">${daysHTML}</div>
                    <div style="margin-top: 10px; font-size:11px; color:#6E6E73;">
                        <span style="margin-right:8px;"><span class="status-free" style="display:inline-block;width:12px;height:12px;"></span> Свободен</span>
                        <span style="margin-right:8px;"><span class="status-busy" style="display:inline-block;width:12px;height:12px;"></span> Занят</span>
                        <span style="margin-right:8px;"><span class="status-req" style="display:inline-block;width:12px;height:12px;"></span> Запрос</span>
                        <span><span class="status-active" style="display:inline-block;width:12px;height:12px;"></span> Актив</span>
                    </div>
                </div>
                
                <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
                    <button onclick="alert('Запрос на бронирование отправлен!')">Пригласить</button>
                    <button class="${isInProject ? 'btn-secondary' : ''}" onclick='toggleProject(${JSON.stringify(artist).replace(/'/g, "&#39;")}, "artist", this)'>
                        ${isInProject ? '✓ В проекте' : '+ В проект'}
                    </button>
                </div>
            `;
            navigateTo('screen-artist');
        }

        // === ДОБАВЛЕНИЕ В ПРОЕКТ ===
        function toggleProject(item, type, btn) {
            const idx = userProject.findIndex(p => p.id === item.id && p.type === type);
            if (idx > -1) {
                userProject.splice(idx, 1);
                btn.innerText = '+ В проект';
                btn.classList.remove('btn-secondary');
                showToast('Удалён из проекта');
            } else {
                userProject.push({ ...item, type });
                btn.innerText = '✓ В проекте';
                btn.classList.add('btn-secondary');
                showToast(`"${item.name}" добавлен в проект!`);
            }
            localStorage.setItem('userProject', JSON.stringify(userProject));
        }

        // === КАТАЛОГ ПЛОЩАДОК ===
        function filterVenues(query) { renderVenues(query); }

        function renderVenues(query = '') {
            const grid = document.getElementById('venues-grid');
            if (!grid) return;
            grid.innerHTML = '';
            let filtered = venues;
            if (query) filtered = filtered.filter(v => v.name.toLowerCase().includes(query.toLowerCase()));

            filtered.forEach(venue => {
                let cell = document.createElement('div');
                cell.className = 'catalog-cell';
                cell.style.backgroundImage = `url('${venue.img}')`;
                cell.innerHTML = `<span>${venue.name}</span>`;
                cell.onclick = () => openVenue(venue.id);
                grid.appendChild(cell);
            });
            if (filtered.length === 0) grid.innerHTML = '<p style="color:#6E6E73; grid-column: 1/-1;">Ничего не найдено</p>';
        }

        // === ДЕТАЛИ ПЛОЩАДКИ ===
        function openVenue(id) {
            const venue = venues.find(v => v.id === id);
            if (!venue) return;
            const container = document.getElementById('venue-detail-content');
            const isInProject = userProject.some(p => p.id === venue.id && p.type === 'venue');
            
            container.innerHTML = `
                <div class="detail-photo" style="background-image: url('${venue.img}')"></div>
                <div class="detail-name">${venue.name}</div>
                <div class="detail-spec">${venue.type} · ${venue.city}</div>
                <div style="margin-bottom:20px; color:#6E6E73; text-align:center;">
                    Вместимость: ${venue.capacity} чел · Аренда: от ${venue.price.toLocaleString()} ₽
                </div>
                
                <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
                    <button onclick="alert('Запрос брони отправлен!')">Запросить бронь</button>
                    <button class="${isInProject ? 'btn-secondary' : ''}" onclick='toggleProject(${JSON.stringify(venue).replace(/'/g, "&#39;")}, "venue", this)'>
                        ${isInProject ? '✓ В проекте' : '+ В проект'}
                    </button>
                </div>
            `;
            navigateTo('screen-venue');
        }

        // === ЦИФЕРБЛАТ (Календарь) ===
        const months = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
        function changeYear(delta) {
            state.year += delta;
            document.getElementById('year-display').innerText = state.year;
            renderWheel();
        }
        function renderWheel() {
            const container = document.getElementById('wheel-container');
            if (!container) return;
            container.innerHTML = '';
            for (let m = 0; m < 12; m++) {
                let angle = m * 30;
                let sector = document.createElement('div');
                sector.className = 'month-sector';
                sector.style.transform = `rotate(${angle}deg)`;
                let daysHTML = '';
                const daysInMonth = new Date(state.year, m + 1, 0).getDate();
                // Показываем все дни месяца
                for (let d = 1; d <= daysInMonth; d++) {
                    let statusClass = 'status-free';
                    let letter = 'С';
                    const dateStr = `${state.year}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const ev = events.find(e => e.date === dateStr);
                    if (ev) {
                        if (ev.status === 'busy') { statusClass = 'status-busy'; letter = 'З'; }
                        else if (ev.status === 'req') { statusClass = 'status-req'; letter = '?'; }
                        else if (ev.status === 'active') { statusClass = 'status-active'; letter = 'А'; }
                        else if (ev.status === 'confirm') { statusClass = 'status-confirm'; letter = 'П'; }
                    }
                    daysHTML += `<div class="inner-hex ${statusClass}">${letter}</div>`;
                }
                sector.innerHTML = `<div class="month-title">${months[m]}</div><div class="inner-hexes">${daysHTML}</div>`;
                sector.onclick = () => openMonth(m);
                container.appendChild(sector);
            }
        }
        function openMonth(m) {
            document.getElementById('modal-date').innerText = `${months[m]} ${state.year}`;
            // Собираем события месяца
            let monthEvents = '';
            const daysInMonth = new Date(state.year, m + 1, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${state.year}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayEvents = events.filter(e => e.date === dateStr);
                if (dayEvents.length) {
                    dayEvents.forEach(ev => {
                        monthEvents += `<p style="font-size:13px;"><b>${d} ${months[m]}:</b> ${ev.time} — ${ev.type || 'Событие'}</p>`;
                    });
                }
            }
            document.getElementById('modal-body').innerHTML = monthEvents || '<p style="color:#6E6E73;">Событий в этом месяце нет</p>';
            document.getElementById('day-details-modal').style.display = 'block';
        }
        function closeModal() { document.getElementById('day-details-modal').style.display = 'none'; }

        // === ИИ-ПОДБОР ===
        function runAIMatch() {
            const date = document.getElementById('match-date').value;
            const genre = document.getElementById('match-genre').value;
            const budget = parseInt(document.getElementById('match-budget').value) || 0;
            const city = document.getElementById('match-city').value.trim().toLowerCase();

            const resultsContainer = document.getElementById('match-results');
            resultsContainer.innerHTML = '<div class="no-results">⏳ Анализируем базу...</div>';

            setTimeout(() => {
                const scored = artists.map(artist => {
                    let score = 0;
                    const reasons = [];

                    // Жёсткий фильтр: свободен ли в дату
                    if (date && !artist.freeDates.includes(date)) {
                        return { ...artist, score: 0, reasons: ['Занят в эту дату'], filtered: true };
                    }

                    if (genre === 'any' || artist.genre === genre) { score += 30; reasons.push(`Жанр: ${artist.genre}`); }
                    if (artist.city.toLowerCase().includes(city) || city.includes(artist.city.toLowerCase())) { score += 25; reasons.push(`Город: ${artist.city}`); }
                    if (budget > 0 && artist.price <= budget) {
                        score += Math.round(20 * (artist.price / budget));
                        reasons.push(`В бюджет: ${artist.price.toLocaleString()} ₽`);
                    } else if (budget > 0 && artist.price > budget) {
                        reasons.push('Дороже бюджета');
                    }
                    score += Math.round((artist.rating / 5) * 15);
                    reasons.push(`Рейтинг: ${artist.rating}`);
                    if (artist.verified) { score += 10; reasons.push('Верифицирован'); }
                    if (date && artist.freeDates.includes(date)) reasons.push(`Свободен ${date}`);

                    return { ...artist, score, reasons };
                })
                .filter(a => !a.filtered && a.score > 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 10);

                if (scored.length === 0) {
                    resultsContainer.innerHTML = '<div class="no-results">😔 Никого не найдено. Попробуйте изменить параметры.</div>';
                    return;
                }

                resultsContainer.innerHTML = `<h3 style="color:#1A1A1A; margin-bottom:12px; font-size:16px;">Найдено ${scored.length} кандидатов:</h3>`;
                
                scored.forEach(artist => {
                    const isInProject = userProject.some(p => p.id === artist.id && p.type === 'artist');
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="avatar" style="background-image: url('${artist.img}')"></div>
                        <div class="info">
                            <div class="name">${artist.name}</div>
                            <div class="spec">${artist.spec} · ${artist.city}</div>
                            <div class="reason">${artist.reasons.join(' · ')}</div>
                        </div>
                        <div class="right-block">
                            <div class="score">${artist.score}%<small>матч</small></div>
                            <button class="add-btn">${isInProject ? '✓ Добавлен' : '+ В проект'}</button>
                        </div>
                    `;
                    // Клик по карточке (кроме кнопки) открывает профиль
                    card.onclick = (e) => {
                        if (e.target.classList.contains('add-btn')) return;
                        openArtist(artist.id);
                    };
                    // Кнопка "Добавить в проект"
                    card.querySelector('.add-btn').onclick = (e) => {
                        e.stopPropagation();
                        toggleProject(artist, 'artist', e.target);
                    };
                    resultsContainer.appendChild(card);
                });
            }, 800);
        }

        // === СТАРТ ===
        loadData();
    </script>
</body>
</html>
