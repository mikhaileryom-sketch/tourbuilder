<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TourBuilder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F5F5F7;color:#1A1A1A;overflow:hidden;height:100dvh;user-select:none;display:flex;flex-direction:column}
.bottom-nav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);padding:10px 18px;border-radius:40px;z-index:1000;box-shadow:0 5px 20px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.05)}
.nav-icon{font-size:22px;color:#6E6E73;cursor:pointer;transition:color .3s,transform .2s}
.nav-icon.active{color:#EC4899;transform:translateY(-3px)}
.screen{display:none;width:100%;height:calc(100vh - 80px);position:absolute;top:0;left:0;overflow-y:auto;padding-bottom:80px;box-sizing:border-box}
.screen.active{display:flex;justify-content:center;align-items:center;flex-direction:column}
button{background:#EC4899;color:#FFF;border:none;padding:12px 30px;border-radius:30px;font-weight:bold;font-size:16px;cursor:pointer;box-shadow:0 4px 15px rgba(236,72,153,.3);transition:transform .2s}
button:active{transform:scale(.95)}
.btn-secondary{background:#FFF;color:#EC4899;border:2px solid #EC4899;box-shadow:none}
#screen-home .honeycomb-frame{position:relative;width:96vw;height:88dvh;clip-path:polygon(25% 0%,75% 0%,100% 25%,100% 75%,75% 100%,25% 100%,0% 75%,0% 25%);background:#FFF;border:2px solid rgba(236,72,153,.2);box-shadow:0 10px 30px rgba(0,0,0,.05);display:flex;justify-content:center;align-items:center}
#screen-home .center-id{width:130px;height:130px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background:#FFF5F9;border:3px solid #EC4899;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-weight:800;font-size:13px;color:#1A1A1A;z-index:15;cursor:pointer;padding:8px;box-sizing:border-box;overflow:hidden;position:relative}
#screen-home .center-id .avatar{width:42px;height:42px;border-radius:50%;background:#EC4899;color:#FFF;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;margin-bottom:4px}
#screen-home .center-id span{font-size:9px;font-weight:400;color:#6E6E73;margin-top:2px}
.user-cell{position:absolute;width:62px;height:62px;background-color:#FCE7F3;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background-size:cover;background-position:center;border:2px solid #E5E5EA;box-shadow:0 4px 10px rgba(0,0,0,.08);cursor:pointer;transition:transform .2s,border-color .2s;z-index:5;transform:translate(-50%,-50%)}
.user-cell:hover{transform:translate(-50%,-50%) scale(1.15);border-color:#EC4899;z-index:50}
.role-icon{position:absolute;bottom:8px;left:8px;font-size:12px;color:#FFF;background:rgba(0,0,0,.65);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;z-index:3;line-height:1}
.star-wrapper{position:absolute;top:8px;right:8px;width:16px;height:16px;z-index:3}
.star-bg{position:absolute;inset:0;color:rgba(255,255,255,.55);font-size:14px}
.star-fill{position:absolute;inset:0;color:#FFC107;font-size:14px;overflow:hidden;text-shadow:0 0 3px rgba(0,0,0,.8)}
.catalog-screen{background:#F5F5F7;padding-top:20px}
.catalog-screen h1{font-size:24px;margin-bottom:20px;color:#1A1A1A}
.search-bar{width:90%;max-width:400px;padding:15px;border:2px solid #E5E5EA;border-radius:30px;font-size:16px;margin-bottom:15px;background:#FFF;outline:none;text-align:center;box-sizing:border-box}
.catalog-grid{display:grid;grid-template-columns:repeat(3,100px);gap:15px;justify-content:center}
.catalog-cell{position:relative;width:100px;height:100px;background-color:#FCE7F3;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background-size:cover;background-position:center;border:2px solid #E5E5EA;cursor:pointer;transition:transform .2s}
.catalog-cell .label{position:absolute;top:42px;left:0;right:0;background:rgba(26,26,26,.85);color:#FFF;font-size:10px;text-align:center;padding:3px 2px;font-weight:600}
.catalog-cell .role-icon{position:absolute;top:12px;left:12px;bottom:auto;width:22px;height:22px;font-size:13px}
.catalog-cell:hover{transform:scale(1.05);border-color:#EC4899}
.detail-screen{background:#F5F5F7;padding:20px;justify-content:flex-start !important}
.detail-photo{width:180px;height:180px;background-color:#FCE7F3;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background-size:cover;background-position:center;border:4px solid #EC4899;margin-bottom:20px;position:relative}
.detail-photo .role-icon{bottom:20px;left:20px;width:28px;height:28px;font-size:16px}
.detail-name{font-size:26px;font-weight:800;color:#1A1A1A;text-align:center}
.detail-spec{font-size:15px;color:#6E6E73;margin-bottom:15px;text-align:center}
.mini-calendar{width:100%;max-width:400px;background:#FFF;border-radius:15px;padding:15px;margin-bottom:20px;box-shadow:0 4px 10px rgba(0,0,0,.03)}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{height:28px;display:flex;justify-content:center;align-items:center;font-size:10px}
.status-free{background:#4CAF50;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);color:#FFF;font-weight:bold;display:flex;justify-content:center;align-items:center}
.status-busy{background:#F44336;border-radius:50%;color:#FFF;font-weight:bold;display:flex;justify-content:center;align-items:center}
.status-req{background:#FFEB3B;border-radius:4px;color:#000;font-weight:bold;display:flex;justify-content:center;align-items:center}
.status-active{background:#2196F3;clip-path:polygon(50% 0%,100% 100%,0% 100%);color:#FFF;font-weight:bold;display:flex;justify-content:center;align-items:center}
.status-confirm{background:#9C27B0;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);color:#FFF;font-weight:bold;display:flex;justify-content:center;align-items:center}
#screen-calendar{background:#F5F5F7;padding:20px;justify-content:flex-start !important;overflow-y:auto}
#screen-calendar h1{color:#1A1A1A;margin-bottom:10px;text-align:center}
.year-nav{display:flex;gap:20px;margin-bottom:15px;align-items:center;justify-content:center}
.month-cards{display:flex;flex-direction:column;gap:20px;width:100%;max-width:400px}
.month-card{background:#FFF;border-radius:16px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.month-card h3{text-align:center;color:#EC4899;font-size:16px;margin-bottom:12px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.cal-dow{text-align:center;font-size:10px;color:#6E6E73;font-weight:600;padding:4px 0}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:600;color:#1A1A1A;cursor:pointer;position:relative}
.cal-cell.empty{color:transparent;pointer-events:none}
.cal-cell .dot{position:absolute;bottom:3px;width:6px;height:6px;border-radius:50%}
.cal-cell.free .dot{background:#4CAF50}
.cal-cell.busy .dot{background:#F44336}
.cal-cell.req .dot{background:#FFEB3B}
.cal-cell.active .dot{background:#2196F3}
.cal-cell.confirm .dot{background:#9C27B0}
.cal-cell.today{border:2px solid #EC4899}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:10px;color:#6E6E73;justify-content:center;margin-top:8px}
.cal-legend span{display:flex;align-items:center;gap:4px}
.cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
#screen-match{background:#F5F5F7;padding:20px;justify-content:flex-start !important;overflow-y:auto}
.form-group{width:100%;max-width:400px;margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:#6E6E73;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:1px solid #E5E5EA;border-radius:12px;font-size:15px;box-sizing:border-box;background:#FFF;outline:none;font-family:inherit}
.form-group textarea{resize:vertical;min-height:60px}
#match-results{width:100%;max-width:400px;margin-top:25px}
.match-card{background:#FFF;border-radius:15px;padding:12px;margin-bottom:12px;box-shadow:0 4px 10px rgba(0,0,0,.04);display:flex;align-items:center;gap:10px;border-left:4px solid #EC4899;animation:slideIn .4s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.match-card .avatar{width:50px;height:50px;flex-shrink:0;background-color:#FCE7F3;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background-size:cover;background-position:center;border:2px solid #EC4899}
.match-card .info{flex-grow:1;text-align:left;min-width:0}
.match-card .name{font-weight:800;font-size:15px;margin-bottom:3px}
.match-card .spec{font-size:11px;color:#6E6E73;margin-bottom:3px}
.match-card .reason{font-size:10px;color:#999;line-height:1.3}
.match-card .right-block{display:flex;flex-direction:column;align-items:center;gap:5px}
.match-card .score{font-weight:900;font-size:18px;color:#EC4899;text-align:center;min-width:45px}
.match-card .score small{display:block;font-size:8px;color:#999;font-weight:400}
.match-card .add-btn{background:#EC4899;color:#FFF;border:none;padding:6px 10px;border-radius:15px;font-size:10px;cursor:pointer;font-weight:bold;white-space:nowrap}
#screen-venues{background:#F5F5F7;padding-top:20px}
#screen-venues h1{font-size:24px;margin-bottom:20px;color:#1A1A1A}
#venues-grid{display:grid;grid-template-columns:repeat(3,100px);gap:15px;justify-content:center}
#screen-profile{background:#F5F5F7;padding:0;justify-content:flex-start !important;overflow-y:auto}
.profile-header{width:100%;background:#FFF;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;border-bottom:1px solid #E5E5EA}
.profile-header .avatar-lg{width:90px;height:90px;background-color:#FCE7F3;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background-size:cover;background-position:center;border:3px solid #EC4899;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;margin-bottom:12px;color:#EC4899}
.profile-header .name{font-size:22px;font-weight:800}
.profile-header .role{font-size:13px;color:#6E6E73;margin-top:4px}
.profile-tabs{display:flex;width:100%;overflow-x:auto;background:#FFF;border-bottom:1px solid #E5E5EA;position:sticky;top:0;z-index:100}
.profile-tab{padding:14px 18px;font-size:13px;color:#6E6E73;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s}
.profile-tab.active{color:#EC4899;border-bottom-color:#EC4899;font-weight:700}
.profile-content{width:100%;padding:20px;box-sizing:border-box;flex:1}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.field-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F0F0F0;font-size:14px}
.field-row .lbl{color:#6E6E73}
.field-row .val{color:#1A1A1A;font-weight:600;text-align:right;max-width:60%}
.list-item{background:#FFF;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.list-item .li-title{font-weight:700;font-size:14px;margin-bottom:4px}
.list-item .li-sub{font-size:12px;color:#6E6E73}
.add-btn-full{width:100%;background:#FFF;color:#EC4899;border:2px dashed #EC4899;padding:12px;border-radius:12px;font-weight:700;margin-top:10px;cursor:pointer}
.edit-section{display:flex;gap:8px;justify-content:center;margin-top:15px}
.toast{position:fixed;top:30px;left:50%;transform:translateX(-50%) translateY(-100px);background:#1A1A1A;color:#FFF;padding:12px 25px;border-radius:30px;font-size:14px;font-weight:600;z-index:9999;transition:transform .4s cubic-bezier(.175,.885,.32,1.275);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{transform:translateX(-50%) translateY(0)}
.back-btn{position:absolute;top:20px;left:20px;background:#FFF;color:#1A1A1A;font-size:24px;border-radius:50%;width:45px;height:45px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:200;border:1px solid #E5E5EA}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:5000;justify-content:center;align-items:center;padding:20px;box-sizing:border-box}
.modal-overlay.open{display:flex}
.modal-content{background:#FFF;border-radius:20px;padding:20px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto}
.modal-content h3{margin:0 0 15px;color:#EC4899}
</style>
</head>
<body>

<div id="screen-home" class="screen active">
  <div class="honeycomb-frame">
    <div class="center-id" id="user-id-block" onclick="openProfileOrCreate()">
      <div class="avatar">T</div>
      TourBuilder
      <span>Маркетплейс</span>
    </div>
    <div id="users-container"></div>
  </div>
</div>

<div id="screen-catalog" class="screen catalog-screen">
  <button class="back-btn" onclick="navigateTo('screen-home')">←</button>
  <h1>Артисты</h1>
  <input type="text" class="search-bar" placeholder="Поиск по имени..." oninput="filterArtists(this.value)">
  <div class="catalog-grid" id="artists-grid"></div>
</div>

<div id="screen-artist" class="screen detail-screen">
  <button class="back-btn" onclick="navigateTo('screen-catalog')">←</button>
  <div id="artist-detail-content"></div>
</div>

<div id="screen-calendar" class="screen">
  <button class="back-btn" onclick="navigateTo('screen-home')">←</button>
  <h1>Календарь</h1>
  <div class="year-nav">
    <button onclick="changeYear(-1)">←</button>
    <span id="year-display" style="font-size:24px;font-weight:bold">2026</span>
    <button onclick="changeYear(1)">→</button>
  </div>
  <div class="month-cards" id="month-cards"></div>
</div>

<div id="screen-match" class="screen">
  <button class="back-btn" onclick="navigateTo('screen-home')">←</button>
  <h1>🔍 ИИ-Подбор</h1>
  <p style="color:#6E6E73;font-size:13px;margin-bottom:20px;text-align:center">Заполните ТЗ — подберём за 10 минут</p>
  <div class="form-group"><label>Дата</label><input type="date" id="match-date" value="2026-09-12"></div>
  <div class="form-group"><label>Жанр</label><select id="match-genre"><option value="any">Любой</option><option value="dance">Танцы</option><option value="music">Музыка</option><option value="show">Шоу</option></select></div>
  <div class="form-group"><label>Бюджет, ₽</label><input type="text" id="match-budget" value="50000"></div>
  <div class="form-group"><label>Город</label><input type="text" id="match-city" value="Москва"></div>
  <button onclick="runAIMatch()" style="margin-top:10px;width:100%;max-width:400px">✨ Подобрать</button>
  <div id="match-results"></div>
</div>

<div id="screen-venues" class="screen catalog-screen">
  <button class="back-btn" onclick="navigateTo('screen-home')">←</button>
  <h1>Площадки</h1>
  <input type="text" class="search-bar" placeholder="Поиск..." oninput="filterVenues(this.value)">
  <div id="venues-grid"></div>
</div>

<div id="screen-venue" class="screen detail-screen">
  <button class="back-btn" onclick="navigateTo('screen-venues')">←</button>
  <div id="venue-detail-content"></div>
</div>

<div id="screen-profile" class="screen">
  <button class="back-btn" onclick="navigateTo('screen-home')">←</button>
  <div class="profile-header" id="profile-header"></div>
  <div class="profile-tabs">
    <div class="profile-tab active" onclick="switchTab(this,'tab-main')">Основное</div>
    <div class="profile-tab" onclick="switchTab(this,'tab-media')">Медиа</div>
    <div class="profile-tab" onclick="switchTab(this,'tab-experience')">Опыт</div>
    <div class="profile-tab" onclick="switchTab(this,'tab-education')">Образование</div>
    <div class="profile-tab" onclick="switchTab(this,'tab-params')">Параметры</div>
    <div class="profile-tab" onclick="switchTab(this,'tab-inventory')">Инвентарь</div>
    <div class="profile-tab" onclick="switchTab(this,'tab-costumes')">Костюмы</div>
  </div>
  <div class="profile-content">
    <div id="tab-main" class="tab-panel active"></div>
    <div id="tab-media" class="tab-panel"></div>
    <div id="tab-experience" class="tab-panel"></div>
    <div id="tab-education" class="tab-panel"></div>
    <div id="tab-params" class="tab-panel"></div>
    <div id="tab-inventory" class="tab-panel"></div>
    <div id="tab-costumes" class="tab-panel"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<div class="bottom-nav">
  <div class="nav-icon active" onclick="navigateTo('screen-home',this)"><i class="fa-solid fa-house"></i></div>
  <div class="nav-icon" onclick="navigateTo('screen-catalog',this)"><i class="fa-solid fa-users"></i></div>
  <div class="nav-icon" onclick="navigateTo('screen-venues',this)"><i class="fa-solid fa-landmark"></i></div>
  <div class="nav-icon" onclick="navigateTo('screen-calendar',this)"><i class="fa-solid fa-calendar"></i></div>
  <div class="nav-icon" onclick="navigateTo('screen-match',this)"><i class="fa-solid fa-magnifying-glass"></i></div>
</div>

<script>
let tgUser = null;
if (window.Telegram && window.Telegram.WebApp) {
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  tg.setHeaderColor('#F5F5F7'); tg.setBackgroundColor('#F5F5F7');
  tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
  console.log('Telegram user:', tgUser);
}

const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycby4Kf6zFXRgX7eyeQaV9wEbqRA4tCW00Uv6QiLYH_KC63LzQWrYbNEeaiYooAGuaBEl/exec';

const ROLE_ICONS = {
  dancer:'fa-person-running', ballet:'fa-child-reaching', singer:'fa-microphone',
  actor:'fa-masks-theater', host:'fa-microphone-lines', musician:'fa-music',
  guitarist:'fa-guitar', drummer:'fa-drum', pianist:'fa-piano-keyboard',
  dj:'fa-compact-disc', magician:'fa-hat-wizard', artist:'fa-paintbrush',
  photographer:'fa-camera', choreographer:'fa-diagram-project',
  soundEngineer:'fa-sliders', lightingEngineer:'fa-lightbulb',
  director:'fa-clapperboard', violinist:'fa-music', saxophonist:'fa-music',
  flutist:'fa-music', other:'fa-star'
};
const ROLE_NAMES = {
  dancer:'Танцор', ballet:'Балет', singer:'Вокалист', actor:'Актёр',
  host:'Ведущий', musician:'Музыкант', guitarist:'Гитарист', drummer:'Барабанщик',
  pianist:'Пианист', dj:'Диджей', magician:'Фокусник', artist:'Художник',
  photographer:'Фотограф', choreographer:'Хореограф', soundEngineer:'Звукорежиссёр',
  lightingEngineer:'Художник по свету', director:'Режиссёр',
  violinist:'Скрипач', saxophonist:'Саксофонист', flutist:'Флейтист', other:'Другое'
};

let artists = [], venues = [], events = [];
let currentArtist = null;
let profileData = { media:[], experience:[], education:[], inventory:[], costumes:[] };
let userProject = JSON.parse(localStorage.getItem('userProject')||'[]');
let state = { year: new Date().getFullYear(), monthIndex: new Date().getMonth() };

async function loadData() {
  try {
    const [a,v,e] = await Promise.all([
      fetch(SHEET_API_URL+'?action=artists').then(r=>r.json()).catch(()=>null),
      fetch(SHEET_API_URL+'?action=venues').then(r=>r.json()).catch(()=>null),
      fetch(SHEET_API_URL+'?action=events').then(r=>r.json()).catch(()=>null)
    ]);
    artists = Array.isArray(a) ? a : [];
    venues = Array.isArray(v) ? v : [];
    events = Array.isArray(e) ? e : [];
  } catch(err) { console.log('loadData err', err); }
  renderHome();
}

function navigateTo(id, el) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-icon').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  if(id==='screen-home') renderHome();
  if(id==='screen-catalog') renderCatalog();
  if(id==='screen-venues') renderVenues();
  if(id==='screen-calendar') renderCalendar();
  if(id==='screen-profile') renderProfile();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.innerText=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function openModal(html){
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }

function renderHome(){
  const blk = document.getElementById('user-id-block');
  if(tgUser && tgUser.first_name){

function renderCatalog(q=''){
  const g=document.getElementById('artists-grid'); g.innerHTML='';

  if(q) list = list.filter(a=>(a.name||'').toLowerCase().includes(q.toLowerCase()));

    c.className='catalog-cell';

  });
  if(!list.length) g.innerHTML='<p style="color:#6E6E73;grid-column:1/-1;text-align:center">Никого не найдено</p>';

function openArtist(id){
  const a = artists.find(x=>x.id===id);
  if(!a) return;
  const c = document.getElementById('artist-detail-content');
  let daysHTML = '';
  const dim = new Date(state.year, state.monthIndex+1, 0).getDate();
  for(let d=1; d<=dim; d++){
    const ds = `${state.year}-${String(state.monthIndex+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ev = events.find(e=>e.date===ds && String(e.artistId)===String(a.id));
    let cls='status-free', l='С';
    if(ev){
      if(ev.status==='busy'){cls='status-busy';l='З';}
      else if(ev.status==='req'){cls='status-req';l='?';}
      else if(ev.status==='active'){cls='status-active';l='А';}
      else if(ev.status==='confirm'){cls='status-confirm';l='П';}
    }
    daysHTML += `<div class="day ${cls}">${l}</div>`;
  }
  const inProj = userProject.some(p=>p.id===a.id && p.type==='artist');
  const roleIcon = ROLE_ICONS[a.role]||'fa-star';
  c.innerHTML = `
    <div class="detail-photo" ${a.img?`style="background-image:url('${a.img}')"`:''}>
      <i class="fa-solid ${roleIcon} role-icon"></i>
    </div>
    <div class="detail-name">${a.name||''}</div>
    <div class="detail-spec">${ROLE_NAMES[a.role]||a.spec||''} · ${a.city||''}</div>
    <div style="margin-bottom:20px;color:#6E6E73;text-align:center">⭐ ${a.rating||0} · от ${(a.price||0).toLocaleString()} ₽</div>
    <h3 style="color:#1A1A1A;font-size:15px;text-align:center">Занятость на ${['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'][state.monthIndex]}</h3>
    <div class="mini-calendar"><div class="days-grid">${daysHTML}</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button onclick="alert('Запрос отправлен!')">Пригласить</button>
      <button class="${inProj?'btn-secondary':''}" onclick='toggleProject(${JSON.stringify(a).replace(/'/g,"&#39;")},"artist",this)'>${inProj?'✓ В проекте':'+ В проект'}</button>
    </div>
  `;
  navigateTo('screen-artist');
}

function toggleProject(item,type,btn){
  const i = userProject.findIndex(p=>p.id===item.id&&p.type===type);
  if(i>-1){
    userProject.splice(i,1); btn.innerText='+ В проект'; btn.classList.remove('btn-secondary');
    showToast('Удалён из проекта');
  } else {
    userProject.push({...item,type}); btn.innerText='✓ В проекте'; btn.classList.add('btn-secondary');
    showToast(`"${item.name}" добавлен!`);
  }
  localStorage.setItem('userProject', JSON.stringify(userProject));
}

const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const daysOfWeek = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

function changeYear(d){ state.year += d; document.getElementById('year-display').innerText = state.year; renderCalendar(); }

function renderCalendar(){
  document.getElementById('year-display').innerText = state.year;
  const c = document.getElementById('month-cards');
  c.innerHTML = '';
  const baseMonth = state.monthIndex;
  const showMonths = [baseMonth - 1, baseMonth, baseMonth + 1].map(m => {
    let mm = m, yy = state.year;
    if(mm < 0){ mm = 11; yy--; }
    if(mm > 11){ mm = 0; yy++; }
    return { m: mm, y: yy };
  });
  showMonths.forEach(({m, y}) => c.appendChild(buildMonthCard(m, y)));
}

function buildMonthCard(m, y){
  const wrap = document.createElement('div');
  wrap.className = 'month-card';
  const dim = new Date(y, m+1, 0).getDate();
  const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
  const todayStr = new Date().toISOString().split('T')[0];
  let html = `<h3>${months[m]} ${y}</h3><div class="cal-grid">`;
  daysOfWeek.forEach(d => html += `<div class="cal-dow">${d}</div>`);
  for(let i=0; i<firstDow; i++) html += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=dim; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ev = events.find(e => e.date === ds);
    let cls = 'free';
    if(ev){
      if(ev.status==='busy') cls='busy';
      else if(ev.status==='req') cls='req';
      else if(ev.status==='active') cls='active';
      else if(ev.status==='confirm') cls='confirm';
    }
    const isToday = ds === todayStr ? ' today' : '';
    html += `<div class="cal-cell ${cls}${isToday}" onclick="openDay('${ds}')"><span>${d}</span><span class="dot"></span></div>`;
  }
  html += `</div>`;
  html += `<div class="cal-legend">
    <span><i style="background:#4CAF50"></i>Свободен</span>
    <span><i style="background:#F44336"></i>Занят</span>
    <span><i style="background:#FFEB3B"></i>Запрос</span>
    <span><i style="background:#2196F3"></i>Актив</span>
    <span><i style="background:#9C27B0"></i>Подтв.</span>
  </div>`;
  wrap.innerHTML = html;
  return wrap;
}

function openDay(ds){
  const list = events.filter(e => e.date === ds);
  let body = '';
  if(!list.length){
    body = '<p style="color:#6E6E73">Свободен весь день</p>';
  } else {
    list.forEach(e => {
      body += `<div class="list-item"><div class="li-title">${e.time||''} — ${e.type||'Событие'}</div><div class="li-sub">${e.venue||''}</div></div>`;
    });
  }
  openModal(`<h3>${ds}</h3>${body}<button onclick="closeModal()" style="width:100%;margin-top:15px">Закрыть</button>`);
}

function runAIMatch(){
  const date=document.getElementById('match-date').value;
  const genre=document.getElementById('match-genre').value;
  const budget=parseInt(document.getElementById('match-budget').value)||0;
  const city=document.getElementById('match-city').value.trim().toLowerCase();
  const rc=document.getElementById('match-results');
  rc.innerHTML='<div style="text-align:center;padding:30px;color:#6E6E73">⏳ Анализируем...</div>';
  setTimeout(()=>{
    const res = artists.map(a=>{
      let s=0; const reasons=[];
      const fd=a.freeDates||[];
      if(date && fd.length>0 && !fd.includes(date)) return null;
      if(genre==='any'||a.genre===genre){s+=30;reasons.push(`Жанр: ${a.genre||'—'}`);}
      if((a.city||'').toLowerCase().includes(city)){s+=25;reasons.push(`Город: ${a.city}`);}
      if(budget>0 && a.price<=budget){s+=Math.round(20*(a.price/budget));reasons.push(`${(a.price||0).toLocaleString()} ₽`);}
      s+=Math.round(((a.rating||0)/5)*15);
      if(a.verified){s+=10;reasons.push('✓');}
      return {...a,score:s,reasons};
    }).filter(a=>a&&a.score>0).sort((a,b)=>b.score-a.score).slice(0,10);
    if(!res.length){ rc.innerHTML='<div style="text-align:center;padding:30px;color:#6E6E73">😔 Никого не найдено</div>'; return; }
    rc.innerHTML=`<h3 style="margin-bottom:12px;font-size:16px">Найдено ${res.length}:</h3>`;
    res.forEach(a=>{
      const inP=userProject.some(p=>p.id===a.id&&p.type==='artist');
      const card=document.createElement('div');
      card.className='match-card';
      card.innerHTML=`
        <div class="avatar" ${a.img?`style="background-image:url('${a.img}')"`:''}></div>
        <div class="info">
          <div class="name">${a.name}</div>
          <div class="spec">${ROLE_NAMES[a.role]||a.spec||''} · ${a.city||''}</div>
          <div class="reason">${a.reasons.join(' · ')}</div>
        </div>
        <div class="right-block">
          <div class="score">${a.score}%<small>матч</small></div>
          <button class="add-btn">${inP?'✓':'+'}</button>
        </div>`;
      card.onclick=e=>{ if(!e.target.classList.contains('add-btn')) openArtist(a.id); };
      card.querySelector('.add-btn').onclick=e=>{e.stopPropagation();toggleProject(a,'artist',e.target);};
      rc.appendChild(card);
    });
  },800);
}

async function openProfileOrCreate(){
  if(!tgUser){ showToast('Откройте через Telegram для профиля'); return; }
  const me = artists.find(a=>String(a.telegramId)===String(tgUser.id));
  if(me){ currentArtist = me; await loadProfileExtras(); navigateTo('screen-profile'); }
  else { openCreateForm(); }
}

async function loadProfileExtras(){
  if(!currentArtist) return;
  try {
    const [m,e,ed,inv,cost] = await Promise.all([
      fetch(SHEET_API_URL+'?action=media').then(r=>r.json()).catch(()=>[]),
      fetch(SHEET_API_URL+'?action=experience').then(r=>r.json()).catch(()=>[]),
      fetch(SHEET_API_URL+'?action=education').then(r=>r.json()).catch(()=>[]),
      fetch(SHEET_API_URL+'?action=inventory').then(r=>r.json()).catch(()=>[]),
      fetch(SHEET_API_URL+'?action=costumes').then(r=>r.json()).catch(()=>[])
    ]);
    const id = String(currentArtist.id);
    profileData.media = (Array.isArray(m)?m:[]).filter(x=>String(x.artistId)===id);
    profileData.experience = (Array.isArray(e)?e:[]).filter(x=>String(x.artistId)===id);
    profileData.education = (Array.isArray(ed)?ed:[]).filter(x=>String(x.artistId)===id);
    profileData.inventory = (Array.isArray(inv)?inv:[]).filter(x=>String(x.artistId)===id);
    profileData.costumes = (Array.isArray(cost)?cost:[]).filter(x=>String(x.artistId)===id);
  } catch(err){ console.log('profile extras err', err); }
}

  openModal(`
    <h3>Создать профиль</h3>
    <div class="form-group"><label>Имя</label><input id="cf-name" value="${tgUser && tgUser.first_name ? tgUser.first_name : ''}"></div>
    <div class="form-group"><label>Роль</label>
      <select id="cf-role">${Object.keys(ROLE_NAMES).map(k=>`<option value="${k}">${ROLE_NAMES[k]}</option>`).join('')}</select>
    </div>
    <div class="form-group"><label>Город</label><input id="cf-city" placeholder="Москва"></div>
    <div class="form-group"><label>Гонорар, ₽</label><input id="cf-price" type="number" value="15000"></div>
    <div class="form-group"><label>Контакты</label><input id="cf-contacts" placeholder="@username"></div>
    <button onclick="submitCreateProfile()" style="width:100%">Создать</button>

}

async function submitCreateProfile(){
  const role = document.getElementById('cf-role').value;
  const body = {
    action:'createArtist', telegramId: tgUser.id,
    name: document.getElementById('cf-name').value,
    role, city: document.getElementById('cf-city').value,
    price: document.getElementById('cf-price').value,
    contacts: document.getElementById('cf-contacts').value,
    img:'', spec: ROLE_NAMES[role], specialty:'dance', genre:'dance',
    readyToTravel:false, countries:''
  };
  try {
    const r = await fetch(SHEET_API_URL, { method:'POST', body:JSON.stringify(body) });
    const res = await r.json();
    if(res.success){ showToast('Профиль создан!'); closeModal(); await loadData(); }
    else showToast('Ошибка: '+(res.error||''));
  } catch(e){ showToast('Ошибка сети'); }
}

function renderProfile(){
  if(!currentArtist) return;
  const a = currentArtist;
  const icon = ROLE_ICONS[a.role]||'fa-star';
  const initial = (a.name||'?')[0].toUpperCase();
  document.getElementById('profile-header').innerHTML = `
    <div class="avatar-lg" ${a.img?`style="background-image:url('${a.img}')"`:''}>${a.img?'':initial}</div>
    <div class="name">${a.name||''}</div>
    <div class="role"><i class="fa-solid ${icon}"></i> ${ROLE_NAMES[a.role]||a.spec||''} · ${a.city||''}</div>
  `;
  document.getElementById('tab-main').innerHTML = `
    <div class="field-row"><span class="lbl">Имя</span><span class="val">${a.name||'—'}</span></div>
    <div class="field-row"><span class="lbl">Роль</span><span class="val">${ROLE_NAMES[a.role]||'—'}</span></div>
    <div class="field-row"><span class="lbl">Специализация</span><span class="val">${a.spec||'—'}</span></div>
    <div class="field-row"><span class="lbl">Жанры</span><span class="val">${a.genre||'—'}</span></div>
    <div class="field-row"><span class="lbl">Город</span><span class="val">${a.city||'—'}</span></div>
    <div class="field-row"><span class="lbl">Контакты</span><span class="val">${a.contacts||'—'}</span></div>
    <div class="field-row"><span class="lbl">Готов к выезду</span><span class="val">${a.readyToTravel?'Да':'Нет'}</span></div>
    <div class="field-row"><span class="lbl">Страны</span><span class="val">${a.countries||'—'}</span></div>
    <div class="edit-section"><button onclick="editMain()">Редактировать</button></div>
  `;
  renderList('media','Медиа');
  renderList('experience','Опыт');
  renderList('education','Образование');
  renderList('inventory','Инвентарь');
  renderList('costumes','Костюмы');
  document.getElementById('tab-params').innerHTML = `
    <div class="field-row"><span class="lbl">Рост</span><span class="val">${a.height||'—'}</span></div>
    <div class="field-row"><span class="lbl">Вес</span><span class="val">${a.weight||'—'}</span></div>
    <div class="field-row"><span class="lbl">Размер одежды</span><span class="val">${a.clothingSize||'—'}</span></div>
    <div class="field-row"><span class="lbl">Размер обуви</span><span class="val">${a.shoeSize||'—'}</span></div>
    <div class="field-row"><span class="lbl">Цвет волос</span><span class="val">${a.hairColor||'—'}</span></div>
    <div class="field-row"><span class="lbl">Цвет глаз</span><span class="val">${a.eyeColor||'—'}</span></div>
  `;

function renderList(key, title){
  const el = document.getElementById('tab-'+key);
  const arr = profileData[key]||[];
  if(!arr.length){
    el.innerHTML = `<div class="list-item"><div class="li-title">Пока нет данных</div><div class="li-sub">Добавьте информацию</div></div><button class="add-btn-full" onclick="addItem('${key}')">+ Добавить</button>`;
    return;
  }
  let html = '';
  arr.forEach(item=>{
    const t = item.name||item.project||item.institution||item.url||'—';
    const sub = item.description||item.specialty||item.year||item.city||'';
    html += `<div class="list-item"><div class="li-title">${t}</div><div class="li-sub">${sub}</div></div>`;
  });
  html += `<button class="add-btn-full" onclick="addItem('${key}')">+ Добавить</button>`;
  el.innerHTML = html;
}

function switchTab(el,panel){
  document.querySelectorAll('.profile-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(panel).classList.add('active');
}

function editMain(){
  const a = currentArtist;

    <h3>Редактировать основное</h3>

    <div class="form-group"><label>Роль</label><select id="e-role">
      ${Object.keys(ROLE_NAMES).map(k=>`<option value="${k}" ${a.role===k?'selected':''}>${ROLE_NAMES[k]}</option>`).join('')}
    </select></div>
    <div class="form-group"><label>Специализация</label><input id="e-spec" value="${a.spec||''}"></div>
    <div class="form-group"><label>Жанры</label><input id="e-genre" value="${a.genre||''}"></div>
    <div class="form-group"><label>Город</label><input id="e-city" value="${a.city||''}"></div>
    <div class="form-group"><label>Контакты</label><input id="e-contacts" value="${a.contacts||''}"></div>
    <div class="form-group"><label>Готов к выезду</label><select id="e-ready"><option value="true" ${a.readyToTravel?'selected':''}>Да</option><option value="false" ${!a.readyToTravel?'selected':''}>Нет</option></select></div>
    <div class="form-group"><label>Страны</label><input id="e-countries" value="${a.countries||''}"></div>
    <button onclick="saveMain()" style="width:100%">Сохранить</button>
  `);

async function saveMain(){
  const fields = {
    name: document.getElementById('e-name').value,
    role: document.getElementById('e-role').value,
    spec: document.getElementById('e-spec').value,
    genre: document.getElementById('e-genre').value,
    city: document.getElementById('e-city').value,
    contacts: document.getElementById('e-contacts').value,
    readyToTravel: document.getElementById('e-ready').value === 'true',
    countries: document.getElementById('e-countries').value
  };
  try {
    const r = await fetch(SHEET_API_URL, { method:'POST', body:JSON.stringify({action:'updateArtist',artistId:currentArtist.id,fields}) });
    const res = await r.json();
    if(res.success){
      Object.assign(currentArtist, fields);
      showToast('Профиль обновлён');
      closeModal(); renderProfile(); loadData();
    } else showToast('Ошибка: '+(res.error||''));
  } catch(e){ showToast('Ошибка сети'); }
}

function addItem(type){
  const title = {media:'Медиа',experience:'Опыт',education:'Образование',inventory:'Инвентарь',costumes:'Костюмы'}[type]||type;
  openModal(`<h3>Добавить: ${title}</h3>
    <div class="form-group"><label>Название / ссылка</label><input id="add-val" placeholder="..."></div>
    <div class="form-group"><label>Описание</label><textarea id="add-desc"></textarea></div>
    <button onclick="saveItem('${type}')" style="width:100%">Добавить</button>
  `);
}

async function saveItem(type){
  const val = document.getElementById('add-val').value;
  const desc = document.getElementById('add-desc').value;
  if(!val) return showToast('Введите значение');
  const map = {media:'addMedia',experience:'addExperience',education:'addEducation',inventory:'addInventory',costumes:'addCostume'};
  const action = map[type] || 'addMedia';
  const payload = { action, artistId: currentArtist.id, name: val, description: desc, url: val };
  try {
    const r = await fetch(SHEET_API_URL, { method:'POST', body:JSON.stringify(payload) });
    const res = await r.json();
    if(res.success){
      showToast('Добавлено'); closeModal();
      await loadProfileExtras();
      renderProfile();
    } else showToast('Ошибка');
  } catch(e){ showToast('Ошибка сети'); }
}
